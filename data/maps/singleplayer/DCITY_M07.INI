Breach1Message=The Shield Wall has been breached! Sandworms and Harkonnen armies are coming through.

[BRIEFING]
Text=Your city lies in a basin behind the Shield Wall, safe from worms, reached only through two narrow western passes. Harkonnen sappers are mining the eastern wall: at the twelfth minute it will break open, and sandworms and the Harkonnen and Sardaukar armies will come straight through the breach. Hold the basin and grow the city to 50,000 people - or destroy both houses.
Win=The breach is held and the invaders are destroyed. The basin is safe.
Lose=The Shield Wall fell, and your city with it.

