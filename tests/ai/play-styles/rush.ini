# Test-only QuantBot play style (docs/ai-play-styles.md; label suffix @rush in
# tests/ai/formation-duel.py and tests/ai/vanilla-match.py). QuantBot Config.ini keys here apply over
# the global config for this one bot; [Play Style] sets the behaviours of QuantBot::PlayStyle.
# Mix slots: tank, siege tank, launcher, special, ornithopter, trike, raider trike, quad.
# Light-vehicle rush: light factory first, small early waves of quads and trikes, no repair-yard wait.

[Force Concentration]
OpeningReadiness=0
WaveReadinessPercent=15

[Play Style]
LightFirst=1
Mix=3000,0,0,0,0,1500,1500,4000
MixBps=8000
MixMinutes=12
MinWaveUnits=4
MinWaveValue=1200
