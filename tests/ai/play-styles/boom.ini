# Test-only QuantBot play style (docs/ai-play-styles.md; label suffix @boom in
# tests/ai/formation-duel.py and tests/ai/vanilla-match.py). QuantBot Config.ini keys here apply over
# the global config for this one bot; [Play Style] sets the behaviours of QuantBot::PlayStyle.
# Mix slots: tank, siege tank, launcher, special, ornithopter, trike, raider trike, quad.
# Boom / fast expand: harvest as if alone on the map, one extra refinery, a second construction yard, full-readiness waves.

[Force Concentration]
WaveReadinessPercent=100

[Play Style]
GreedyHarvest=1
ExtraRefineries=1
MinYards=2
