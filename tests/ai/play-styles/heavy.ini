# Test-only QuantBot play style (docs/ai-play-styles.md; label suffix @heavy in
# tests/ai/formation-duel.py and tests/ai/vanilla-match.py). QuantBot Config.ini keys here apply over
# the global config for this one bot; [Play Style] sets the behaviours of QuantBot::PlayStyle.
# Mix slots: tank, siege tank, launcher, special, ornithopter, trike, raider trike, quad.
# Super-unit push: half the army in the house special (Devastator / Sonic Tank / Deviator).

[Play Style]
Mix=2500,1500,1000,5000,0,0,0,0
MixBps=7000
