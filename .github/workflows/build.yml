name: Build Dune Legacy

run-name: ${{ (inputs.ios_staging == true || github.event.schedule == '23 4 * * 1') && format('iOS internal staging {0}', github.event.schedule == '23 4 * * 1' && 'weekly selection' || github.ref_name) || (github.event_name == 'schedule' || inputs.staging_sha != '') && format('Staging packages {0}', inputs.staging_sha || 'scheduled integration head') || format('CI {0}', github.ref_name) }}

on:
  push:
    branches: [ main, release-*, integrate/feature-batch ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '17 */2 * * *'
    - cron: '47 3 * * *'
    # Weekly internal iOS is a separate hosted request, never a desktop dependency.
    - cron: '23 4 * * 1'
  workflow_dispatch:
    inputs:
      staging_sha:
        description: 'Package this exact full 40-character integration SHA after green CI (never stable identity).'
        type: string
        default: ''
      integration_run_id:
        description: 'Optional producing integration CI receipt; every required platform/test job is checked.'
        type: string
        default: ''
      ios_staging:
        description: 'Export an internal-only signed dev IPA from this published immutable staging tag. Never uploads to TestFlight.'
        type: boolean
        default: false
      windows_cache_probe:
        description: 'Validate Windows compiler-cache reuse only; publish nothing.'
        type: boolean
        default: false
      linux_audio_probe:
        description: 'Validate Linux audio/packages only; publish nothing.'
        type: boolean
        default: false
      android_package_probe:
        description: 'Build an Android candidate only; public upgrade signing is separate.'
        type: boolean
        default: false
      android_release_build:
        description: 'Explicit official identity for the independent Android candidate.'
        type: boolean
        default: false
      macos_skin_probe:
        description: 'Validate unsigned hosted Mac rendering/performance only; publish nothing.'
        type: boolean
        default: false
      nightly_probe:
        description: 'Run the nightly test tier now; publish nothing.'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ inputs.ios_staging == true && format('ios-staging-{0}', github.ref) || github.event.schedule == '23 4 * * 1' && 'ios-staging-scheduler' || startsWith(github.ref, 'refs/tags/v') && format('stable-{0}', github.ref) || (github.event_name == 'schedule' || inputs.staging_sha != '') && 'staging-packages' || inputs.nightly_probe == true && format('nightly-probe-{0}', github.ref) || format('ci-{0}', github.head_ref || github.ref) }}
  cancel-in-progress: ${{ inputs.ios_staging != true && inputs.nightly_probe != true && !startsWith(github.ref, 'refs/tags/v') && github.event_name != 'schedule' && inputs.staging_sha == '' }}

env:
  DUNECITY_RELEASE_BUILD: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && 'ON' || 'OFF' }}

jobs:
  select-inputs:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.select.outputs.sha }}
      run: ${{ steps.select.outputs.run }}
      package: ${{ steps.select.outputs.package }}
      stable: ${{ steps.select.outputs.stable }}
      staging: ${{ steps.select.outputs.staging }}
      tier: ${{ steps.select.outputs.tier }}
      tag: ${{ steps.select.outputs.tag }}
      ios: ${{ steps.select.outputs.ios }}
      ios_dispatch: ${{ steps.select.outputs.ios_dispatch }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve immutable integration or release inputs
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release-automation.py plan --output selection.json
      - uses: actions/upload-artifact@v7
        with:
          name: DuneCity-selection-${{ steps.select.outputs.sha }}-${{ github.run_attempt }}
          path: selection.json
          if-no-files-found: error

  relay-tests:
    # A Windows cache probe validates the Windows job in isolation.
    needs: [select-inputs]
    if: needs.select-inputs.outputs.run == 'true' && inputs.windows_cache_probe != true && inputs.linux_audio_probe != true && inputs.android_package_probe != true && inputs.macos_skin_probe != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.select-inputs.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/room-relay/package-lock.json
      - run: npm ci --ignore-scripts && npm test
        working-directory: tools/room-relay
      - name: Verify relay deployment recovery and artifact checks
        run: |
          python3 tools/room-relay/deploy/test-artifact-manifest.py
          python3 tools/room-relay/deploy/test-relay-supervisor.py
          python3 tools/room-relay/deploy/test-release-pinning.py
  # Exercise the real PHP introduction service; this job never deploys it.
  signaling-tests:
    needs: [select-inputs]
    if: needs.select-inputs.outputs.run == 'true' && inputs.windows_cache_probe != true && inputs.linux_audio_probe != true && inputs.android_package_probe != true && inputs.macos_skin_probe != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.select-inputs.outputs.sha }}
      - name: Run the signaling service test suite
        run: |
          php --version
          python3 -m unittest discover -s tools/p2p-signaling/test -p 'test_*.py'

  # Gate: on v* tag builds, verify that the source-controlled version metadata
  # (CMakeLists.txt, include/config.h, vcpkg.json) already matches the tag.
  # This catches missing bump commits BEFORE any build/release/upload runs.
  verify-version:
    needs: [select-inputs]
    if: needs.select-inputs.outputs.run == 'true' && needs.select-inputs.outputs.stable == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.select-inputs.outputs.sha }}
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Verify source version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Tag version: $TAG_VERSION"
          bash scripts/bump-version.sh --check
          SOURCE_VERSION=$(sed -n 's/^project(DuneCity VERSION \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' CMakeLists.txt)
          if [ "$SOURCE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch: tag is v${TAG_VERSION} but source metadata says ${SOURCE_VERSION}."
            echo "::error::Commit the version bump with 'scripts/bump-version.sh ${TAG_VERSION}' before tagging."
            exit 1
          fi
          echo "OK — all source files agree on $SOURCE_VERSION, matches tag v${TAG_VERSION}"

  test-linux:
    runs-on: ubuntu-latest
    # The nightly tier builds every target and runs the long tests on two cores.
    timeout-minutes: ${{ needs.select-inputs.outputs.tier == 'nightly' && 180 || 45 }}
    needs: [select-inputs, verify-version]
    # !cancelled(), not always(): a running job whose condition is always() ignores cancellation.
    if: |
      !cancelled() && needs.select-inputs.outputs.run == 'true' && inputs.windows_cache_probe != true && inputs.linux_audio_probe != true && inputs.android_package_probe != true && inputs.macos_skin_probe != true &&
      (needs.verify-version.result == 'success' || needs.verify-version.result == 'skipped')
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.select-inputs.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsdl2-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libcurl4-openssl-dev libssl-dev python3-cryptography \
            catch2 libminiupnpc-dev

      # Native packet tests need headers; framing vectors also need the SDK's
      # ESM exports, produced by its prepare script.
      - name: Install the pinned p2pkit SDK
        working-directory: platform/web
        run: npm ci

      - name: Verify signed update feeds and AppImage replacement
        run: |
          python3 -m unittest discover -s scripts/tests -p test_desktop_updates.py
          python3 -m unittest discover -s scripts/tests -p test_checkout_content.py
          python3 -m unittest discover -s scripts/tests -p test_release_automation.py
          python3 -m unittest discover -s scripts/tests -p test_ios_staging.py
          python3 -m unittest discover -s tests/performance -p test_fixture_reconstruction.py
          python3 -m unittest discover -s scripts/tests -p test_macos_runtime.py
          python3 -m unittest discover -s tests/menu -p test_probe_process.py
          python3 tests/desktop-updater/run-appimage-flow.py --output "$RUNNER_TEMP/appimage-update-test"

      - name: Configure CMake
        # The unit tests exercise the direct transport with fake data channels, so this job does
        # not need libdatachannel; the interoperability harness in tools/p2p-interop does, and is
        # built where that dependency is provisioned. A Debug build turns on AddressSanitizer and
        # UndefinedBehaviorSanitizer by default: any report aborts the test that hit it.
        run: cmake -B build -DDUNECITY_BUILD_TESTS=ON -DDUNECITY_DIRECT_P2P=OFF -DCMAKE_BUILD_TYPE=Debug -DDUNECITY_RELEASE_BUILD=OFF

      - name: Build tests
        run: |
          # No unbounded -j: sanitizer translation units can exhaust a hosted
          # runner before it reports a compiler error. Keep all test targets.
          if [ '${{ needs.select-inputs.outputs.tier }}' = nightly ]; then
            cmake --build build --parallel 2
          else
            cmake --build build --parallel 2 --target dunelegacy_tests network_wire_harness \
              relay_wire_harness relay_session_tests relay_http_transport_tests desktop_updater_tests \
              renderer_initialization_tests
          fi

      - name: Check native and browser framing still agree
        run: node tools/p2p-interop/framing-vectors.mjs

      - name: Check the browser signaling fetch keeps its guarantees
        # The JavaScript inside the EM_JS blocks is not reachable by a C++ compiler and not
        # exercised by a wasm link either, so it gets its own regression test.
        run: node tools/p2p-interop/signaling-fetch.test.mjs

      - name: Run tests
        env:
          ASAN_OPTIONS: detect_stack_use_after_return=1:strict_string_checks=1:check_initialization_order=1
          UBSAN_OPTIONS: print_stacktrace=1
        # Capability and tier are independent: hosted Linux never admits GUI tests.
        run: ctest --test-dir build --output-on-failure --no-tests=error --parallel 2 -L '${{ needs.select-inputs.outputs.tier }}' -LE gui

  build-emscripten:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    needs: [select-inputs, verify-version]
    if: |
      !cancelled() && needs.select-inputs.outputs.run == 'true' && inputs.windows_cache_probe != true && inputs.linux_audio_probe != true && inputs.android_package_probe != true && inputs.macos_skin_probe != true &&
      (needs.select-inputs.outputs.tier != 'nightly' || needs.select-inputs.outputs.package == 'true') &&
      (needs.verify-version.result == 'success' || needs.verify-version.result == 'skipped')
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.select-inputs.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            platform/web/package-lock.json
            tools/p2pkit-build/package-lock.json

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3

      - name: Check browser build safety
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_web_build.py'
          python3 -m unittest discover -s scripts/tests -p 'test_check_web_mods.py'

      # The p2pkit SDK (headers + --js-library glue) is a real dependency of the
      # browser build; CMake configure refuses to proceed without it.
      - name: Install the pinned p2pkit SDK
        working-directory: platform/web
        run: npm ci

      - name: Test browser matchmaking glue and runtime packaging
        working-directory: platform/web
        run: npm test

      # The direct-play bridge bundle is committed for reproducible browser builds.
      # These three steps are what keeps that honest: install the pinned tool (and the
      # p2pkit package its tests exercise through genuine package exports), prove the
      # SDK transport and the bridge still behave, and prove the committed bundle is what
      # this source actually produces.
      - name: Install the pinned bundler
        working-directory: tools/p2pkit-build
        run: npm ci

      - name: Test the pinned P2PKit transport and the bridge
        working-directory: tools/p2pkit-build
        run: |
          node --test test.mjs
          node --test bridge.test.mjs

      - name: Verify the committed bridge bundle is reproducible
        run: |
          node tools/p2pkit-build/build.mjs
          if ! git diff --quiet -- platform/web/p2p-direct.js; then
            echo "ERROR: platform/web/p2p-direct.js does not match a rebuild from source." >&2
            echo "Run: node tools/p2pkit-build/build.mjs and commit the result." >&2
            git --no-pager diff --stat -- platform/web/p2p-direct.js >&2
            exit 1
          fi

      - name: Build browser target
        run: ./tools/web/build-emscripten.sh

      - name: Check browser peer teardown with AddressSanitizer
        run: |
          source .emsdk/emsdk_env.sh
          tests/wasm/run-webrtc-peer-lifecycle.sh

      - name: Freeze the verified browser package
        if: needs.select-inputs.outputs.package == 'true'
        env:
          WEB_CHANNEL: ${{ needs.select-inputs.outputs.stable == 'true' && 'stable' || 'staging' }}
        run: |
          PLAY_ROOT="$RUNNER_TEMP/$(test "$WEB_CHANNEL" = staging && echo play-staging || echo play)"
          python3 scripts/package-web.py --build-root build/emscripten --play-root "$PLAY_ROOT" \
            --channel "$WEB_CHANNEL" --signaling-origin https://dunelegacy.com
          mkdir -p browser-package
          python3 scripts/release-automation.py record-build --platform emscripten \
            --build-root build/emscripten --output browser-package/build-inputs-emscripten.json
          tar -czf browser-package/DuneCity-browser.tar.gz -C "$PLAY_ROOT" .
          python3 scripts/package-p2p-service.py --output "$RUNNER_TEMP/browser-service"
          tar -czf browser-package/DuneCity-p2p-service.tar.gz -C "$RUNNER_TEMP/browser-service" .
      - name: Upload frozen browser artifacts
        if: needs.select-inputs.outputs.package == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: DuneCity-Emscripten
          overwrite: true
          path: browser-package/*
          if-no-files-found: error
          retention-days: 30

  build-windows:
    timeout-minutes: 40
    runs-on: windows-2022
    # Wait for version check on tag builds; run unconditionally otherwise
    needs: [select-inputs, verify-version]
    if: ${{ !cancelled() && needs.select-inputs.outputs.run == 'true' && (needs.select-inputs.outputs.tier != 'nightly' || needs.select-inputs.outputs.package == 'true') && inputs.linux_audio_probe != true && inputs.android_package_probe != true && inputs.macos_skin_probe != true && (needs.verify-version.result == 'success' || needs.verify-version.result == 'skipped') }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.select-inputs.outputs.sha }}
          persist-credentials: false

      - name: Install NSIS
        run: choco install nsis --no-progress -y

      - name: Preflight Windows installer configuration
        run: |
          cmake -S tests/windows-installer -B installer-preflight
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cpack --config installer-preflight/CPackConfig.cmake -G NSIS -B installer-preflight/package
          if ($LASTEXITCODE -ne 0) {
            Get-ChildItem installer-preflight -Recurse -Filter NSISOutput.log | ForEach-Object { Get-Content $_.FullName }
            exit 1
          }

      - name: Check installer desktop shortcut
        run: |
          # The fixture installer on this disposable runner: a default silent install must
          # create the desktop shortcut and the uninstaller must remove it.
          $installer = Get-ChildItem installer-preflight/package -Filter *.exe | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP 'dunecity-installer-preflight'
          $link = Join-Path ([Environment]::GetFolderPath('CommonDesktopDirectory')) 'Dune City.lnk'
          $install = Start-Process $installer.FullName -ArgumentList '/S', "/D=$dir" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited with $($install.ExitCode)" }
          if (-not (Test-Path $link)) { throw 'The installer did not create the desktop shortcut' }
          $target = (New-Object -ComObject WScript.Shell).CreateShortcut($link).TargetPath
          if ($target -ne (Join-Path $dir 'dunecity.exe')) { throw "The desktop shortcut points to '$target'" }
          $uninstall = Start-Process (Join-Path $dir 'Uninstall.exe') -ArgumentList '/S', "_?=$dir" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0 -or (Test-Path $link)) { throw 'The uninstaller did not remove the desktop shortcut' }

      - name: Set Windows dependency cache location
        id: windows-vcpkg-cache
        run: |
          $cache = Join-Path $env:LOCALAPPDATA 'vcpkg/archives'
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          "path=$cache" >> $env:GITHUB_OUTPUT
          "image=$env:ImageVersion" >> $env:GITHUB_OUTPUT
          # vcpkg.json also carries the application version, so hashing the
          # whole manifest changed the primary key on every release bump.
          # Hash only the fields that change what vcpkg builds.
          $dependencies = python scripts/vcpkg-dependency-key.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "dependencies=$dependencies" >> $env:GITHUB_OUTPUT

      - name: Cache Windows dependency binaries
        uses: actions/cache@v6
        with:
          path: ${{ steps.windows-vcpkg-cache.outputs.path }}
          key: vcpkg-windows-x64-v1-${{ steps.windows-vcpkg-cache.outputs.image }}-${{ steps.windows-vcpkg-cache.outputs.dependencies }}
          restore-keys: |
            vcpkg-windows-x64-v1-${{ steps.windows-vcpkg-cache.outputs.image }}-
            vcpkg-windows-x64-v1-

      # Ninja needs cl.exe on PATH; the Visual Studio generator would find it
      # on its own, but Ninja plus a compiler launcher is what makes the
      # compile cache usable at all.
      - name: Initialise the MSVC x64 toolchain
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9
        with:
          version: v0.18.0

      - name: Set Windows compiler cache location
        id: windows-sccache
        run: |
          $cache = Join-Path $env:LOCALAPPDATA 'sccache'
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          "path=$cache" >> $env:GITHUB_OUTPUT
          # Persist the cache ourselves through actions/cache below instead of
          # sccache's GitHub Actions backend.
          "SCCACHE_GHA_ENABLED=false" >> $env:GITHUB_ENV
          "SCCACHE_DIR=$cache" >> $env:GITHUB_ENV
          "SCCACHE_CACHE_SIZE=2G" >> $env:GITHUB_ENV

      # A unique key per run means actions/cache always writes a fresh entry
      # on success; the prefixes restore the newest cache built on the same
      # runner image (object hits depend on the exact compiler binary).
      - name: Cache Windows compiled objects
        uses: actions/cache@v6
        with:
          path: ${{ steps.windows-sccache.outputs.path }}
          key: sccache-windows-x64-v1-${{ steps.windows-vcpkg-cache.outputs.image }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sccache-windows-x64-v1-${{ steps.windows-vcpkg-cache.outputs.image }}-
            sccache-windows-x64-v1-

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'vcpkg.json'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platform/web/package-lock.json

      # The p2pkit SDK headers are a configure-time dependency on every
      # platform (the packet streams and WebRtcTransport alias include them);
      # headers ship in the git package, so no prepare/build scripts are needed.
      - name: Install the pinned p2pkit SDK headers
        working-directory: platform/web
        run: npm ci --ignore-scripts

      # run-vcpkg still selects the removed x-gha backend and clears the
      # default cache. Use the persisted files provider, as on Linux/macOS.
      # vcpkg validates package ABIs before reusing restored binaries.
      - name: Enable Windows dependency binary caching
        env:
          WINDOWS_VCPKG_CACHE: ${{ steps.windows-vcpkg-cache.outputs.path }}
        run: |
          "VCPKG_BINARY_SOURCES=clear;files,$env:WINDOWS_VCPKG_CACHE,readwrite" >> $env:GITHUB_ENV

      - name: Configure CMake
        # Quote the -D arg so PowerShell expands $env:VCPKG_ROOT instead
        # of treating the colon-slash as a literal string. Without the
        # quotes CMake gets the unexpanded path and fails to find the
        # toolchain file.
        #
        # Precompiled headers are off here on purpose: sccache cannot cache
        # an /Yc or /Yu compile, so PCH would make every translation unit a
        # miss. Local Visual Studio builds keep the default (PCH on).
        run: |
          cmake -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            "-DDUNECITY_RELEASE_BUILD=$env:DUNECITY_RELEASE_BUILD" `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
            -DDUNECITY_ENABLE_PCH=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        # Ninja schedules source files concurrently, unlike MSBuild /m which
        # primarily schedules projects. Bound memory use to four compilers.
        timeout-minutes: 30
        run: |
          sccache --zero-stats
          cmake --build build --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          sccache --show-stats

      # Validation only (workflow_dispatch with windows_cache_probe). The
      # build above filled the cache; throw the build tree away and prove the
      # rebuild is served from it. Nothing here publishes.
      - name: Probe the compiler cache with a clean rebuild
        if: ${{ inputs.windows_cache_probe }}
        timeout-minutes: 30
        run: |
          Remove-Item -Recurse -Force build
          sccache --zero-stats
          cmake -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DDUNECITY_RELEASE_BUILD=OFF `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
            -DDUNECITY_ENABLE_PCH=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # `Cache hits` / `Cache misses` are stable across sccache releases;
          # the JSON schema is not, so read the summary table.
          $stats = (sccache --show-stats | Out-String)
          Write-Host $stats
          $hit = [regex]::Match($stats, '(?m)^Cache hits\s+(\d+)\s*$')
          $miss = [regex]::Match($stats, '(?m)^Cache misses\s+(\d+)\s*$')
          if (-not ($hit.Success -and $miss.Success)) {
            throw "Could not read sccache statistics"
          }
          $hits = [int]$hit.Groups[1].Value
          $misses = [int]$miss.Groups[1].Value
          $total = $hits + $misses
          if ($total -eq 0) { throw "The rebuild compiled nothing; the cache was not exercised" }
          $rate = [math]::Round(100.0 * $hits / $total, 1)
          Write-Host "Compiler cache hit rate: $rate% ($hits hits, $misses misses)"
          if ($hits -lt 100 -or $hits * 10 -lt $total * 9) {
            throw "Compiler cache hit rate $rate% is below 90% or fewer than 100 hits; caching is not working"
          }

      - name: Check nested game stack budgets
        run: |
          python scripts/check-windows-nested-game-stack.py --build-dir build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify secure relay support
        run: |
          $game = Get-ChildItem build -Recurse -Filter dunecity.exe | Select-Object -First 1
          if (-not $game) { throw "Game binary missing" }
          $probe = Start-Process -FilePath $game.FullName -ArgumentList '--check-relay-support' -Wait -PassThru -NoNewWindow
          if ($probe.ExitCode -ne 0) { exit $probe.ExitCode }

      - name: Create Installer Package
        if: needs.select-inputs.outputs.package == 'true' && inputs.windows_cache_probe != true
        run: |
          cd build
          cmake --install . --prefix install --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($runtime in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            if (-not (Test-Path "install/$runtime")) { throw "Missing bundled MSVC runtime: $runtime" }
          }
          if ((Get-Item install/README).LinkType) { throw "Packaged README must be a regular file" }
          cpack -G ZIP -C Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cpack -G NSIS -C Release
          if ($LASTEXITCODE -ne 0) {
            Get-ChildItem _CPack_Packages -Recurse -Filter NSISOutput.log | ForEach-Object { Get-Content $_.FullName }
            exit 1
          }

      - name: Preserve installer diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: Windows-installer-diagnostics-${{ github.run_attempt }}
          path: |
            installer-preflight/package/**/NSISOutput.log
            installer-preflight/package/**/project.nsi
            build/_CPack_Packages/**/NSISOutput.log
            build/_CPack_Packages/**/project.nsi
            build/*.zip
            build/*.exe

      - name: Record Windows package inputs
        if: success() && needs.select-inputs.outputs.package == 'true' && inputs.windows_cache_probe != true
        run: python scripts/release-automation.py record-build --platform windows-x64 --build-root build --output build/build-inputs-windows-x64.json
      - name: Upload Installer
        if: success() && needs.select-inputs.outputs.package == 'true' && inputs.windows_cache_probe != true
        uses: actions/upload-artifact@v7
        with:
          name: DuneCity-Windows-Installer
          overwrite: true
          path: |
            build/*.zip
            build/*.exe
            build/build-inputs-windows-x64.json
          if-no-files-found: error

  release-headless-qualification:
    # Production consumes frozen pre-production evidence; it never reruns the broad suite.
    needs: [select-inputs, verify-version]
    if: success() && needs.select-inputs.outputs.stable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.select-inputs.outputs.sha }}
          persist-credentials: false
      - name: Require verified qualification for the exact candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.select-inputs.outputs.sha }}
        run: python3 scripts/release-automation.py reuse-qualification --sha "$CANDIDATE_SHA" --directory qualification
      - uses: actions/upload-artifact@v7
        with:
          name: DuneCity-macOS-headless-qualification
          path: qualification/
          if-no-files-found: error
          retention-days: 90

  build-macos:
    # Untrusted PRs and routine staging never reach a persistent signing host.
    runs-on: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && fromJSON('["self-hosted","macOS","ARM64","dunecity-builder"]') || 'macos-15' }}
    needs: [select-inputs, verify-version, release-headless-qualification]
    if: |
      !cancelled() && needs.select-inputs.outputs.run == 'true' &&
      inputs.windows_cache_probe != true && inputs.linux_audio_probe != true &&
      inputs.android_package_probe != true &&
      (needs.verify-version.result == 'success' || needs.verify-version.result == 'skipped') &&
      (needs.select-inputs.outputs.stable != 'true' || needs.release-headless-qualification.result == 'success')
    # The nightly tier was cut off at 60 minutes with 18 of 220 tests still to run.
    timeout-minutes: ${{ needs.select-inputs.outputs.tier == 'nightly' && 240 || 60 }}
    permissions:
      contents: read
    env:
      PACKAGE_BUILD: ${{ needs.select-inputs.outputs.package }}
      DUNECITY_CANDIDATE_SOURCE: ${{ needs.select-inputs.outputs.sha }}
      MACOS_SKIN_PROBE: ${{ inputs.macos_skin_probe || false }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
      TEST_TIER: ${{ needs.select-inputs.outputs.tier }}
    steps:
      - name: Initialize honest packaged-GUI coverage status
        run: |
          OUT="$RUNNER_TEMP/dunecity-pointer-mapping-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$OUT"
          printf '%s\n' '{"status":"not-run","reason":"Native GUI gate prerequisites have not completed; inspect the failed prerequisite step"}' > "$OUT/gate-status.json"
          # ccache-action otherwise restores non-source files into $GITHUB_WORKSPACE/.ccache.
          # Keep compiler-cache bytes outside the exact committed candidate input.
          printf 'CCACHE_DIR=%s/dunecity-ccache\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.select-inputs.outputs.sha }}
          persist-credentials: false
      - name: Require source-bound production admission before using the Mini
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_SHA: ${{ needs.select-inputs.outputs.sha }}
        run: |
          TOKEN=$(python3 scripts/release-automation.py reservation-token --sha "$RELEASE_SHA")
          echo "::add-mask::$TOKEN"
          echo "DUNECITY_RESERVATION=$TOKEN" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require the declared Mac architecture
        run: test "$(uname -m)" = arm64
      - name: Restore compiled Mac objects
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: macos-arm64-${{ hashFiles('vcpkg.json') }}
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'vcpkg.json'
      - name: Restore dependency binaries
        uses: actions/cache@v6
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-macos-arm64-${{ hashFiles('vcpkg.json') }}
      - name: Enable portable dependency cache
        run: |
          mkdir -p "$HOME/.cache/vcpkg/archives"
          echo "VCPKG_BINARY_SOURCES=clear;files,$HOME/.cache/vcpkg/archives,readwrite" >> "$GITHUB_ENV"
      - name: Build unsigned hosted Mac coverage
        if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/v')
        run: bash scripts/macos-ci-lane.sh
      - name: Reserve the shared Mini build, signing and GUI lane
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.select-inputs.outputs.stable == 'true'
        env:
          RELEASE_SHA: ${{ needs.select-inputs.outputs.sha }}
        run: |
          OWNER="github:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:macos"
          agent-workspace run --project dunecity --owner "$OWNER" --tests --wait -- \
            dunecity-queue reservation run --cwd "$GITHUB_WORKSPACE" --rev "$RELEASE_SHA" \
            --owner "$OWNER" --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" \
            --lane macos-build --purpose release --reservation "$DUNECITY_RESERVATION" -- \
            bash "$GITHUB_WORKSPACE/scripts/macos-ci-lane.sh"
      - name: Retain producer-bound static SDL pointer fixture separately
        if: always() && needs.select-inputs.outputs.package == 'true' && hashFiles(format('build/pointer-diagnostic-{0}-{1}/pointer-fixture.tar.gz', github.run_id, github.run_attempt)) != ''
        uses: actions/upload-artifact@v7
        with:
          name: DuneCity-macOS-pointer-fixture-${{ needs.select-inputs.outputs.sha }}-${{ github.run_attempt }}
          path: build/pointer-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}/pointer-fixture.tar.gz
          if-no-files-found: error
          retention-days: 90
      - name: Retain all packaged GUI and signing diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: DuneCity-macOS-pointer-regression-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/dunecity-pointer-mapping-${{ github.run_id }}-${{ github.run_attempt }}/
            ${{ runner.temp }}/dunecity-skin-probe-${{ github.run_id }}-${{ github.run_attempt }}/
            ${{ runner.temp }}/dunecity-mac-signed-${{ github.run_id }}-${{ github.run_attempt }}/*.json
          if-no-files-found: warn
          retention-days: 30
      # A failed probe prints only its launcher's traceback; the game's own log says why.
      - name: Retain nightly probe logs
        if: always() && needs.select-inputs.outputs.tier == 'nightly'
        uses: actions/upload-artifact@v7
        with:
          name: DuneCity-macOS-nightly-logs-${{ github.run_attempt }}
          path: |
            build/**/*.log
            !build/vcpkg_installed/**
            !build/CMakeFiles/**
            !build/_deps/**
          if-no-files-found: warn
          retention-days: 14
      - name: Record Mac package inputs
        if: always() && needs.select-inputs.outputs.package == 'true' && hashFiles('build/CMakeCache.txt') != ''
        run: python3 scripts/release-automation.py record-build --platform macos-arm64 --build-root build --output build/build-inputs-macos-arm64.json
      - name: Upload complete Mac package set
        if: success() && needs.select-inputs.outputs.package == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: DuneCity-macOS-DMG
          overwrite: true
          path: |
            build/*-macOS.dmg
            build/*-macOS.zip
            build/macos-signing.json
            build/build-inputs-macos-arm64.json
          if-no-files-found: error
          retention-days: 30
      - name: Preserve unqualified Mac packages after a later GUI failure
        if: failure() && needs.select-inputs.outputs.package == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: DuneCity-macOS-failed-packages-${{ github.run_attempt }}
          path: |
            build/*-macOS.dmg
            build/*-macOS.zip
            build/macos-signing.json
            build/build-inputs-macos-arm64.json
          if-no-files-found: warn
          retention-days: 30

  build-linux:
    # Keep the release ABI on an older, stable glibc baseline. A moving
    # ubuntu-latest runner produced binaries requiring GLIBC_2.38.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    needs: [select-inputs, verify-version]
    if: |
      !cancelled() && needs.select-inputs.outputs.run == 'true' && inputs.windows_cache_probe != true && inputs.android_package_probe != true && inputs.macos_skin_probe != true &&
      (needs.select-inputs.outputs.tier != 'nightly' || needs.select-inputs.outputs.package == 'true') &&
      (needs.verify-version.result == 'success' || needs.verify-version.result == 'skipped')
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.select-inputs.outputs.sha }}
          persist-credentials: false

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: linux-${{ hashFiles('vcpkg.json') }}

      # vcpkg builds several autotools-based ports from source on Linux
      # (libxcrypt, sdl2-mixer's flac/opus/etc.) and needs the GNU build
      # toolchain pre-installed on the runner. Without these the Configure
      # step fails with: "libxcrypt currently requires ... autoconf
      # autoconf-archive automake libtoolize". Also pulling in
      # build-essential + libltdl-dev so any other transitive port that
      # needs them is happy.
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf autoconf-archive automake libtool libltdl-dev \
            build-essential pkg-config bison flex python3-jinja2 \
            libgl1-mesa-dev libegl1-mesa-dev \
            libx11-dev libxft-dev libxext-dev libwayland-dev libxkbcommon-dev libibus-1.0-dev \
            libsystemd-dev libpulse-dev libpipewire-0.3-dev xvfb xauth

      - name: Cache vcpkg binary packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/vcpkg/archives
          # SDL auto-detects GL/GLX headers. Do not restore older SDL archives
          # built without the graphics development packages above.
          key: vcpkg-linux-x64-graphics-v2-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-linux-x64-graphics-v2-

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'vcpkg.json'

      # run-vcpkg sets VCPKG_BINARY_SOURCES to 'clear;x-gha,readwrite' but
      # the x-gha backend was removed from vcpkg. The 'clear' prefix also
      # disables the default file-based cache. Override to use files-based
      # caching backed by the actions/cache step above.
      - name: Fix vcpkg binary caching
        run: echo "VCPKG_BINARY_SOURCES=clear;files,$HOME/.cache/vcpkg/archives,readwrite" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platform/web/package-lock.json

      # The p2pkit SDK headers are a configure-time dependency on every
      # platform (the packet streams and WebRtcTransport alias include them).
      - name: Install the pinned p2pkit SDK headers
        working-directory: platform/web
        run: npm ci --ignore-scripts

      - name: Configure CMake
        run: cmake -B build -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_BUILD_TYPE=Release -DDUNECITY_RELEASE_BUILD="$DUNECITY_RELEASE_BUILD"

      - name: Build
        # Limit to 2 parallel jobs — ubuntu-latest has 4 cores but only 7GB
        # RAM, and 4 concurrent g++ -O2 processes on large TUs exceed that.
        run: cmake --build build --config Release --parallel 2

      - name: Verify secure relay support
        run: build/bin/dunecity --check-relay-support

      - name: Verify real Linux audio backends and silent recovery
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_audio_runtime.py'
          python3 scripts/check-audio-runtime.py --binary build/bin/dunecity --require-driver alsa --require-driver pulseaudio --require-driver pipewire

      - name: Verify Linux graphics backends and software recovery
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_video_runtime.py'
          xvfb-run -a python3 scripts/check-video-runtime.py --binary build/bin/dunecity --require-driver opengl --require-accelerated

      - name: Create Linux Packages
        if: needs.select-inputs.outputs.package == 'true'
        run: |
          cd build
          cmake --install . --prefix install --config Release
          cpack -G "DEB;RPM;TGZ" -C Release

      - name: Create AppImage
        if: needs.select-inputs.outputs.package == 'true'
        run: |
          # Download linuxdeploy (fuse-less FUSE_APPIMAGE_EXTRACT_AND_RUN avoids
          # "fuse: device not found" errors on GitHub-hosted runners)
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage

          # Stage the AppDir from the cmake install tree
          cd build
          cmake --install . --prefix AppDir/usr --config Release

          # Ensure icons and desktop file are in the right AppDir locations
          mkdir -p AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/128x128/apps
          cp ../dunecity.desktop AppDir/usr/share/applications/
          cp ../dunecity-128x128.png AppDir/usr/share/icons/hicolor/128x128/apps/dunecity.png

          # linuxdeploy bundles the binary's shared-library dependencies into the
          # AppDir, generates AppRun, and creates the final .AppImage
          ARCH=x86_64 FUSE_APPIMAGE_EXTRACT_AND_RUN=1 \
            ../linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable AppDir/usr/bin/dunecity \
            --desktop-file AppDir/usr/share/applications/dunecity.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/128x128/apps/dunecity.png \
            --output appimage

          # Rename with version for clarity
          VERSION=$(sed -n 's/^project(DuneCity VERSION \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' ../CMakeLists.txt)
          mv DuneCity-*.AppImage "DuneCity-${VERSION}-Linux-x86_64.AppImage" 2>/dev/null || true

      - name: Smoke-test portable Linux packages
        if: needs.select-inputs.outputs.package == 'true'
        run: |
          set -euo pipefail

          VERSION=$(sed -n 's/^project(DuneCity VERSION \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' CMakeLists.txt)
          SMOKE_ROOT="$RUNNER_TEMP/dunecity-linux-smoke"
          rm -rf "$SMOKE_ROOT"
          mkdir -p "$SMOKE_ROOT/tgz" "$SMOKE_ROOT/home"

          tar -xzf "build/DuneCity-${VERSION}-Linux-x64.tar.gz" -C "$SMOKE_ROOT/tgz"
          TGZ_BIN=$(find "$SMOKE_ROOT/tgz" -type f -path '*/bin/dunecity' -print -quit)
          TGZ_DATA=$(find "$SMOKE_ROOT/tgz" -type f -name 'DUNE.PAK' -print)
          APPIMAGE="build/DuneCity-${VERSION}-Linux-x86_64.AppImage"

          python3 scripts/check-audio-runtime.py --binary "$TGZ_BIN" --require-driver alsa --require-driver pulseaudio --require-driver pipewire
          APPIMAGE_EXTRACT_AND_RUN=1 python3 scripts/check-audio-runtime.py --binary "$APPIMAGE" --require-driver alsa --require-driver pulseaudio --require-driver pipewire
          xvfb-run -a python3 scripts/check-video-runtime.py --binary "$TGZ_BIN" --require-driver opengl --require-accelerated
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a python3 scripts/check-video-runtime.py --binary "$APPIMAGE" --require-driver opengl --require-accelerated

          echo "TGZ executable: ${TGZ_BIN:-missing}"
          echo "TGZ DUNE.PAK: ${TGZ_DATA:-missing}"
          data_notice=${TGZ_DATA//'%'/'%25'}
          data_notice=${data_notice//$'\r'/'%0D'}
          data_notice=${data_notice//$'\n'/'%0A'}
          echo "::notice title=TGZ data layout::${data_notice:-DUNE.PAK was not packaged}"

          if [ -z "$TGZ_BIN" ] || [ ! -x "$TGZ_BIN" ]; then
            echo "::error title=TGZ smoke setup failed::Packaged dunecity executable was not found or is not executable."
            find "$SMOKE_ROOT/tgz" -maxdepth 4 -type f -print
            exit 1
          fi
          if [ ! -x "$APPIMAGE" ]; then
            echo "::error title=AppImage smoke setup failed::Expected AppImage is missing or not executable: $APPIMAGE"
            find build -maxdepth 1 -type f -print
            exit 1
          fi

          smoke_launch() {
            local label="$1"
            shift
            local executable="$1"
            shift
            local launch_dir
            launch_dir=$(cd "$(dirname "$executable")" && pwd)
            executable="$launch_dir/$(basename "$executable")"
            set +e
            (
              cd "$launch_dir"
              env -u SDL_RENDER_DRIVER HOME="$SMOKE_ROOT/home" SDL_AUDIODRIVER=dummy \
                timeout 12s xvfb-run -a "$executable" "$@" --showlog
            ) >"$SMOKE_ROOT/${label}.log" 2>&1
            local status=$?
            set -e

            if [ "$status" -ne 124 ] || grep -Eq 'An unhandled exception|DuneCity will now be terminated' "$SMOKE_ROOT/${label}.log"; then
              echo "${label} exited during startup (status ${status})"
              cat "$SMOKE_ROOT/${label}.log"
              find "$SMOKE_ROOT/home" -type f -name '*.log' -exec sh -c \
                'echo "--- $1"; cat "$1"' _ {} \;
              local details
              details=$(sed -n '1,80p' "$SMOKE_ROOT/${label}.log")
              details=${details//'%'/'%25'}
              details=${details//$'\r'/'%0D'}
              details=${details//$'\n'/'%0A'}
              echo "::error title=${label} portable startup failed (status ${status})::${details:-No process output was captured.}"
              return 1
            fi
          }

          smoke_status=0
          smoke_launch tgz "$TGZ_BIN" || smoke_status=1
          APPIMAGE_EXTRACT_AND_RUN=1 smoke_launch appimage "$APPIMAGE" || smoke_status=1
          exit "$smoke_status"

      - name: Record Linux package inputs
        if: success() && needs.select-inputs.outputs.package == 'true'
        run: python3 scripts/release-automation.py record-build --platform linux-x86_64 --build-root build --output build/build-inputs-linux-x86_64.json
      - name: Upload Packages
        if: success() && needs.select-inputs.outputs.package == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: DuneCity-Linux-Packages
          overwrite: true
          path: |
            build/*.deb
            build/*.rpm
            build/*.tar.gz
            build/*.AppImage
            build/build-inputs-linux-x86_64.json

          if-no-files-found: error
          retention-days: 30
      - name: Preserve failed Linux package/runtime evidence
        if: failure() && needs.select-inputs.outputs.package == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: DuneCity-Linux-failed-packages-${{ github.run_attempt }}
          path: |
            build/*.deb
            build/*.rpm
            build/*.tar.gz
            build/*.AppImage
            ${{ runner.temp }}/dunecity-linux-smoke/
          if-no-files-found: warn
          retention-days: 30

  # Candidate only: never upload a private signing key to this hosted runner.
  android-package:
    needs: [select-inputs]
    if: needs.select-inputs.outputs.run == 'true' && inputs.android_package_probe == true && inputs.macos_skin_probe != true
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.select-inputs.outputs.sha }}
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platform/web/package-lock.json
      - name: Configure Android toolchain and dependency cache
        id: android-cache
        shell: pwsh
        run: |
          $sdk = if ($env:ANDROID_HOME) { $env:ANDROID_HOME } else { $env:ANDROID_SDK_ROOT }
          if (-not $sdk) { throw 'Android SDK not found on runner' }
          $manager = Join-Path $sdk 'cmdline-tools/latest/bin/sdkmanager.bat'
          & $manager --install 'ndk;28.2.13676358' 'platforms;android-34' 'build-tools;34.0.0'
          if ($LASTEXITCODE -ne 0) { throw 'Android SDK installation failed' }
          "ANDROID_HOME=$sdk" >> $env:GITHUB_ENV
          "ANDROID_SDK_ROOT=$sdk" >> $env:GITHUB_ENV
          "ANDROID_NDK_HOME=$(Join-Path $sdk 'ndk/28.2.13676358')" >> $env:GITHUB_ENV
          $vcpkg = if ($env:VCPKG_ROOT) { $env:VCPKG_ROOT } else { $env:VCPKG_INSTALLATION_ROOT }
          if (-not (Test-Path -LiteralPath (Join-Path $vcpkg 'vcpkg.exe'))) { throw 'vcpkg not found on runner' }
          "VCPKG_ROOT=$vcpkg" >> $env:GITHUB_ENV
          $cache = Join-Path $env:LOCALAPPDATA 'vcpkg/archives'
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          "VCPKG_BINARY_SOURCES=clear;files,$cache,readwrite" >> $env:GITHUB_ENV
          "path=$cache" >> $env:GITHUB_OUTPUT
          "image=$env:ImageVersion" >> $env:GITHUB_OUTPUT
          $dependencies = python scripts/vcpkg-dependency-key.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "dependencies=$dependencies" >> $env:GITHUB_OUTPUT
      - uses: actions/cache@v6
        with:
          path: ${{ steps.android-cache.outputs.path }}
          key: vcpkg-android-arm64-v1-${{ steps.android-cache.outputs.image }}-${{ steps.android-cache.outputs.dependencies }}
          restore-keys: |
            vcpkg-android-arm64-v1-${{ steps.android-cache.outputs.image }}-
            vcpkg-android-arm64-v1-
            vcpkg-windows-x64-v1-${{ steps.android-cache.outputs.image }}-
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-v1-${{ runner.os }}-${{ hashFiles('scripts/package-android-apk.ps1') }}
          restore-keys: gradle-android-v1-${{ runner.os }}-
      - name: Install pinned SDK headers
        working-directory: platform/web
        run: npm ci --ignore-scripts
      - name: Build native ARM64 and APK candidate
        shell: pwsh
        run: |
          python -m unittest discover -s scripts/tests -p test_android_payload.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/package-android-apk.ps1 -RepoRoot $env:GITHUB_WORKSPACE -BuildNative -NativeBuildJobs 2 -BuildApk -ReleaseBuild:('${{ inputs.android_release_build }}' -eq 'true')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check-build-deps.py build-android-arm64-ndk
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify-android-payload.py --root $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload runner-key-signed candidate (not public release)
        uses: actions/upload-artifact@v7
        with:
          name: DuneCity-Android-Runner-Candidate
          path: |
            build-android-apk/app/build/outputs/apk/debug/DuneLegacy.apk
            android-version.json

  # Reuse the existing dev publisher, but publish a complete immutable source set.
  dev-release:
    needs: [select-inputs, test-linux, relay-tests, signaling-tests, build-emscripten, build-windows, build-linux, build-macos]
    if: |
      always() && !cancelled() &&
      needs.select-inputs.result == 'success' &&
      needs.test-linux.result == 'success' &&
      needs.relay-tests.result == 'success' &&
      needs.signaling-tests.result == 'success' &&
      needs.build-emscripten.result == 'success' &&
      needs.build-windows.result == 'success' &&
      needs.build-linux.result == 'success' &&
      needs.build-macos.result == 'success' &&
      github.event_name != 'pull_request' && needs.select-inputs.outputs.staging == 'true' &&
      needs.select-inputs.outputs.package == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    concurrency:
      group: dunecity-staging-lifecycle
      cancel-in-progress: false
      queue: max
    env:
      DUNECITY_STAGING_LIFECYCLE: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.select-inputs.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: DuneCity-Windows-Installer
          path: dist/windows
      - uses: actions/download-artifact@v8
        with:
          name: DuneCity-macOS-DMG
          path: dist/macos
      - uses: actions/download-artifact@v8
        with:
          name: DuneCity-Linux-Packages
          path: dist/linux
      - uses: actions/download-artifact@v8
        with:
          name: DuneCity-Emscripten
          path: dist/browser
      - name: Preserve exact source and publication inputs
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_TAG: ${{ needs.select-inputs.outputs.tag }}
          STAGING_SHA: ${{ needs.select-inputs.outputs.sha }}
        run: |
          python3 scripts/release-automation.py manifest --directory dist --sha "$STAGING_SHA" --tag "$STAGING_TAG"
      - uses: actions/upload-artifact@v7
        with:
          name: DuneCity-Publication-inputs-${{ github.run_attempt }}
          path: |
            dist/publication-inputs.json
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 90
      - name: Publish without touching Latest or update feeds
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_TAG: ${{ needs.select-inputs.outputs.tag }}
          STAGING_SHA: ${{ needs.select-inputs.outputs.sha }}
        run: python3 scripts/release-automation.py publish --directory dist --sha "$STAGING_SHA" --tag "$STAGING_TAG"
      - name: Preserve staging retention decisions independently of package status
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Staging-retention-${{ github.run_attempt }}
          path: ${{ runner.temp }}/staging-retention.json
          if-no-files-found: warn
          retention-days: 90

  request-staging-packages:
    needs: [select-inputs, test-linux, relay-tests, signaling-tests, build-emscripten, build-windows, build-linux, build-macos]
    if: |
      always() && !cancelled() &&
      needs.select-inputs.result == 'success' &&
      needs.test-linux.result == 'success' &&
      needs.relay-tests.result == 'success' &&
      needs.signaling-tests.result == 'success' &&
      needs.build-emscripten.result == 'success' &&
      needs.build-windows.result == 'success' &&
      needs.build-linux.result == 'success' &&
      needs.build-macos.result == 'success' &&
      github.event_name == 'push' && github.ref == 'refs/heads/integrate/feature-batch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.select-inputs.outputs.sha }}
          persist-credentials: false
      - name: Request a debounced green snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_SHA: ${{ needs.select-inputs.outputs.sha }}
        run: python3 scripts/release-automation.py dispatch-staging --sha "$STAGING_SHA"

  # Only trusted stable tags reach the local update-signing key.
  sign-desktop-updates:
    needs: [select-inputs, build-windows, build-linux, build-macos]
    if: success() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.select-inputs.outputs.stable == 'true'
    runs-on: [self-hosted, macOS, ARM64, dunecity-builder]
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.select-inputs.outputs.sha }}
          persist-credentials: false
      - name: Require the same source-bound production reservation
        env:
          RELEASE_SHA: ${{ needs.select-inputs.outputs.sha }}
        run: |
          TOKEN=$(python3 scripts/release-automation.py reservation-token --sha "$RELEASE_SHA")
          echo "::add-mask::$TOKEN"
          echo "DUNECITY_RESERVATION=$TOKEN" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          name: DuneCity-Windows-Installer
          path: update-input/windows
      - uses: actions/download-artifact@v8
        with:
          name: DuneCity-Linux-Packages
          path: update-input/linux
      - uses: actions/download-artifact@v8
        with:
          name: DuneCity-macOS-DMG
          path: update-input/macos
      - name: Prepare update-signing Python
        run: |
          python3 -m venv "$RUNNER_TEMP/dunecity-update-signing-python"
          "$RUNNER_TEMP/dunecity-update-signing-python/bin/pip" install --disable-pip-version-check cryptography==50.0.1

      - name: Prepare signed update feeds
        env:
          UPDATE_TAG: ${{ github.ref_name }}
          UPDATE_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ needs.select-inputs.outputs.sha }}
        run: |
          OWNER="github:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:update-signing"
          agent-workspace run --project dunecity --owner "$OWNER" --tests --wait -- \
            dunecity-queue reservation run --cwd "$GITHUB_WORKSPACE" --rev "$RELEASE_SHA" \
            --owner "$OWNER" --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" \
            --lane macos-feeds --purpose release --reservation "$DUNECITY_RESERVATION" -- \
            bash "$GITHUB_WORKSPACE/scripts/macos-ci-lane.sh" feeds
      - uses: actions/upload-artifact@v7
        with:
          name: DuneCity-Update-Feeds
          overwrite: true
          path: update-feeds/*
          if-no-files-found: error

  # Publish all binaries and their signed feeds together after every build passes.
  release:
    needs: [select-inputs, verify-version, test-linux, relay-tests, signaling-tests, build-emscripten, build-windows, build-linux, build-macos, sign-desktop-updates]
    # Missing desktop assets, GUI gates or signature identities block Latest.
    if: success() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.select-inputs.outputs.stable == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          # All tags and history: the website's release history page is built from them.
          fetch-depth: 0
          ref: ${{ needs.select-inputs.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: DuneCity-Windows-Installer
          path: dist/windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v8
        with:
          name: DuneCity-macOS-DMG
          path: dist/macos

      - name: Download Linux artifact
        uses: actions/download-artifact@v8
        with:
          name: DuneCity-Linux-Packages
          path: dist/linux

      - name: Download signed update feeds
        uses: actions/download-artifact@v8
        with:
          name: DuneCity-Update-Feeds
          path: dist/updates
      - name: Download the already-built browser package
        uses: actions/download-artifact@v8
        with:
          name: DuneCity-Emscripten
          path: dist/browser
      - name: Restore the already-qualified hosted Mac headless receipt
        uses: actions/download-artifact@v8
        with:
          name: DuneCity-macOS-headless-qualification
          path: dist/headless

      - name: Verify all official assets and persist publication inputs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.select-inputs.outputs.tag }}
          RELEASE_SHA: ${{ needs.select-inputs.outputs.sha }}
        run: |
          python3 -m pip install --disable-pip-version-check cryptography==50.0.1
          python3 scripts/release-automation.py manifest --stable --directory dist --sha "$RELEASE_SHA" --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@v7
        with:
          name: DuneCity-Publication-inputs-${{ github.run_attempt }}
          path: |
            dist/publication-inputs.json
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 90
      - name: Publish only the fully verified immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.select-inputs.outputs.tag }}
          RELEASE_SHA: ${{ needs.select-inputs.outputs.sha }}
        run: python3 scripts/release-automation.py publish --directory dist --sha "$RELEASE_SHA" --tag "$RELEASE_TAG"

      - name: Update dunelegacy.com website
        env:
          WEBSITE_DEPLOY_KEY: ${{ secrets.WEBSITE_DEPLOY_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # Strip leading 'v' to get bare version number (e.g. v1.0.5 -> 1.0.5)
          VERSION="${TAG#v}"

          if [ -z "$WEBSITE_DEPLOY_KEY" ]; then
            echo "WEBSITE_DEPLOY_KEY is not configured" >&2
            exit 1
          fi

          # Authenticate to dunelegacy.com with an SSH deploy key (write-enabled).
          # Deploy keys don't expire — unlike the old WEBSITE_DEPLOY_TOKEN PAT,
          # which lapsed and silently broke this step.
          mkdir -p ~/.ssh
          printf '%s\n' "$WEBSITE_DEPLOY_KEY" > ~/.ssh/website_deploy
          chmod 600 ~/.ssh/website_deploy
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/website_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

          git clone git@github.com:VR48/dunelegacy.com.git website-repo
          cd website-repo

          # Guard: don't let a stale older run overwrite a newer version.
          CURRENT=$(sed -n 's/.*softwareVersion": "\([0-9]*\.[0-9]*\.[0-9]*\)".*/\1/p' website/index.html | head -1)
          if [ -n "$CURRENT" ] && [ "$(printf '%s\n%s\n' "$CURRENT" "$VERSION" | sort -V | tail -1)" != "$VERSION" ]; then
            echo "Website already at $CURRENT, skipping update to $VERSION (older)"
            exit 0
          fi

          # Replace version numbers and download URLs in both HTML files
          for FILE in website/index.html website/dune-city.html; do
            # Download URLs: v1.0.4/DuneCity-1.0.4-... -> vVERSION/DuneCity-VERSION-...
            sed -i "s|/v[0-9]\+\.[0-9]\+\.[0-9]\+/DuneCity-[0-9]\+\.[0-9]\+\.[0-9]\+-|/v${VERSION}/DuneCity-${VERSION}-|g" "$FILE"
            # The EXE installs the Windows updater; the portable ZIP remains available on Releases.
            sed -i "s|Windows-x64\.zip|Windows-x64.exe|g" "$FILE"
            sed -i '/DuneCity-.*-Windows-x64[.]exe/s|>Download ZIP<|>Download Installer<|g' "$FILE"
            # Debian package names use lowercase and underscores.
            sed -i "s|/v[0-9]\+\.[0-9]\+\.[0-9]\+/dunecity_[0-9]\+\.[0-9]\+\.[0-9]\+_amd64\.deb|/v${VERSION}/dunecity_${VERSION}_amd64.deb|g" "$FILE"
            # Release tag links
            sed -i "s|releases/tag/v[0-9]\+\.[0-9]\+\.[0-9]\+|releases/tag/v${VERSION}|g" "$FILE"
            # Desktop release copy. Android is versioned independently, so its
            # labels must not be caught by these patterns.
            #
            # Since 1.0.599 all three desktop platforms ship from the same tag —
            # the Mac mini runner builds a DMG for every release — so the copy
            # says "Desktop: X.Y.Z" and "Windows, macOS and Linux X.Y.Z" rather
            # than carrying macOS as a separate, older version. The old
            # "no X macOS build exists" and "This is not version X" rewrites are
            # deliberately gone: left in place they would have restated a claim
            # that is now false, on the same page as a working DMG link.
            sed -i "s|>Dune City [0-9]\+\.[0-9]\+\.[0-9]\+<|>Dune City ${VERSION}<|g" "$FILE"
            sed -i "s|Desktop: [0-9]\+\.[0-9]\+\.[0-9]\+|Desktop: ${VERSION}|g" "$FILE"
            sed -i "s|Windows, macOS and Linux [0-9]\+\.[0-9]\+\.[0-9]\+|Windows, macOS and Linux ${VERSION}|g" "$FILE"
            # Desktop hero button text.
            sed -i "s|>Download [0-9]\+\.[0-9]\+\.[0-9]\+</a>|>Download ${VERSION}</a>|g" "$FILE"
            # Latest label: "Latest: X.X.X"
            sed -i "s|Latest: [0-9]\+\.[0-9]\+\.[0-9]\+|Latest: ${VERSION}|g" "$FILE"
            # Schema softwareVersion
            sed -i "s|softwareVersion\": \"[0-9]\+\.[0-9]\+\.[0-9]\+\"|softwareVersion\": \"${VERSION}\"|g" "$FILE"
            # "X.X.X is current"
            sed -i "s|[0-9]\+\.[0-9]\+\.[0-9]\+ is current|${VERSION} is current|g" "$FILE"
          done

          # Release history page (website/changelog.html): every published release with its
          # releases/desktop notes, or its commit summaries when it has none.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | {tag: .tag_name, published: .published_at}' \
            > "$RUNNER_TEMP/releases.jsonl"
          python3 scripts/build-changelog.py --game-repo "$GITHUB_WORKSPACE" --releases "$RUNNER_TEMP/releases.jsonl"

          git config user.email "ci@dunelegacy.com"
          git config user.name "DuneCity CI"
          git add website/index.html website/dune-city.html website/changelog.html
          git diff --cached --quiet || git commit -m "release: bump website to Dune City ${VERSION}"
          git push

  request-ios-staging:
    needs: [select-inputs]
    if: github.event_name == 'schedule' && github.event.schedule == '23 4 * * 1' && needs.select-inputs.outputs.ios_dispatch == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Request the qualified immutable source, not default-branch source
        env:
          GH_TOKEN: ${{ github.token }}
          IOS_TAG: ${{ needs.select-inputs.outputs.tag }}
        run: gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref "$IOS_TAG" -f ios_staging=true

  ios-staging:
    needs: [select-inputs]
    # The external Mini pre-job gate independently authenticates this immutable
    # published snapshot and its API qualification; this conditional is not it.
    if: github.event_name == 'workflow_dispatch' && inputs.ios_staging == true && startsWith(github.ref, 'refs/tags/staging-') && needs.select-inputs.outputs.ios == 'true'
    runs-on: [self-hosted, macOS, ARM64, dunecity-builder]
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    steps:
      - name: Initialize truthful internal export disposition
        run: |
          OUT="$RUNNER_TEMP/dunecity-ios-staging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$OUT"
          printf '%s\n' '{"status":"not-run","deviceCoverage":"untested","testflightPublication":"not-requested"}' > "$OUT/job-status.json"
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.select-inputs.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Freeze qualified inputs and allocate the unique Apple build number
        id: ios-inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OUT="$RUNNER_TEMP/dunecity-ios-staging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/release-automation.py ios-inputs --tag "$GITHUB_REF_NAME" \
            --sha "$GITHUB_SHA" --output "$OUT/publication-inputs.json"
          NUMBER=$(python3 scripts/release-automation.py ios-build-number \
            --run-number "$GITHUB_RUN_NUMBER" --attempt "$GITHUB_RUN_ATTEMPT")
          echo "build_number=$NUMBER" >> "$GITHUB_OUTPUT"
      - name: Admit one internal export through the shared Mini verification lane
        env:
          IOS_BUILD_NUMBER: ${{ steps.ios-inputs.outputs.build_number }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/dunecity-ios-staging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          OWNER="github:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:ios"
          set +e
          agent-workspace run --project dunecity --owner "$OWNER" --tests --wait -- \
            dunecity-queue reservation run --cwd "$GITHUB_WORKSPACE" --rev "$GITHUB_SHA" \
            --owner "$OWNER" --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" \
            --lane ios-staging --purpose verification -- \
            bash "$GITHUB_WORKSPACE/scripts/macos-ci-lane.sh" ios-staging 2>&1 | tee "$OUT/build.log"
          STATUS=${PIPESTATUS[0]}
          set -e
          export IOS_STAGE_EXIT="$STATUS"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          status = int(os.environ['IOS_STAGE_EXIT'])
          record = dict(status='packaged' if status == 0 else 'held' if status == 3 else 'failed',
                        exitCode=status, sourceCommit=os.environ['GITHUB_SHA'],
                        deviceCoverage='untested', testflightPublication='not-requested')
          output = Path(os.environ['RUNNER_TEMP']) / ('dunecity-ios-staging-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'])
          if status == 0 and not Path('build-ios-device/appstore/staging-build.json').is_file():
              record['status'] = 'failed'
              record['reason'] = 'Missing verified internal export manifest'
          (output / 'job-status.json').write_text(json.dumps(record, indent=2) + '\n')
          if record['status'] == 'failed' and status == 0:
              raise SystemExit(record['reason'])
          PY
          exit "$STATUS"
      - name: Retain internal IPA provenance and all failed export diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: DuneCity-iOS-internal-${{ needs.select-inputs.outputs.sha }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            build-ios-device/appstore/*.ipa
            build-ios-device/appstore/staging-build.json
            build-ios-device/appstore/staging-signing.txt
            build-ios-device/appstore/ExportOptions.plist
            ${{ runner.temp }}/dunecity-ios-staging-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 90
