name: Qualify release candidate
run-name: Qualify ${{ inputs.sha || github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows: [Build Dune Legacy]
    types: [completed]
    branches: [integrate/feature-batch]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Full SHA of a green integration candidate; freeze version/defaults first.'
        type: string
        required: true

permissions:
  contents: read
  actions: read

# Keep one automatic qualifier running and only the newest pending candidate.
# Explicit frozen candidates use their own group and cannot be displaced by pushes.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('qualification-{0}', inputs.sha) || 'qualification-auto' }}
  cancel-in-progress: false

jobs:
  select-candidate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.select.outputs.run }}
      sha: ${{ steps.select.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release-automation.py select-qualification

  qualify:
    needs: [select-candidate]
    if: needs.select-candidate.outputs.run == 'true'
    runs-on: macos-15
    timeout-minutes: 120
    env:
      DUNECITY_RELEASE_BUILD: 'OFF'
      PACKAGE_BUILD: 'false'
      DUNECITY_CANDIDATE_SOURCE: ${{ needs.select-candidate.outputs.sha }}
      TEST_TIER: nightly
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - name: Keep compiler cache outside candidate source
        run: printf 'CCACHE_DIR=%s/dunecity-ccache\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.select-candidate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require the declared hosted Mac architecture
        run: test "$(uname -m)" = arm64
      - name: Restore compiled Mac objects
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: macos-arm64-${{ hashFiles('vcpkg.json') }}
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'vcpkg.json'
      - name: Restore dependency binaries
        uses: actions/cache@v6
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-macos-arm64-${{ hashFiles('vcpkg.json') }}
      - name: Enable portable dependency cache
        run: |
          mkdir -p "$HOME/.cache/vcpkg/archives"
          echo "VCPKG_BINARY_SOURCES=clear;files,$HOME/.cache/vcpkg/archives,readwrite" >> "$GITHUB_ENV"
      - name: Qualify frozen staging source before production selection
        run: bash scripts/macos-ci-lane.sh release-headless-qualification
      - name: Freeze successful source/toolchain/test qualification
        run: |
          python3 scripts/release-automation.py record-build --platform macos-arm64-headless-qualification \
            --build-root build --output build/macos-headless-qualification.json
      - uses: actions/upload-artifact@v7
        with:
          name: DuneCity-macOS-headless-qualification-${{ github.run_attempt }}
          path: |
            build/macos-headless-qualification.json
            build/macos-headless-plan.json
            build/macos-headless-results.xml
          if-no-files-found: error
          retention-days: 90
      - name: Preserve failed hosted qualification diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: DuneCity-macOS-headless-diagnostics-${{ github.run_attempt }}
          path: |
            build/Testing/Temporary/
            build/macos-headless-plan.json
            build/macos-headless-results.xml
          if-no-files-found: warn
          retention-days: 90

