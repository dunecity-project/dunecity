name: Qualify release candidate
run-name: Qualify ${{ inputs.sha || github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows: [Build Dune Legacy]
    types: [completed]
    branches: [integrate/feature-batch]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Full SHA of a green integration candidate; freeze version/defaults first.'
        type: string
        required: true
      backend:
        description: 'Prefer the Mini when available; hosted is the bounded fallback.'
        type: choice
        options: [auto, hosted]
        default: auto

permissions:
  contents: read
  actions: read

# Keep one automatic qualifier running and only the newest pending candidate.
# Explicit frozen candidates use their own group and cannot be displaced by pushes.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('qualification-{0}-{1}', inputs.sha, inputs.backend || 'auto') || 'qualification-auto' }}
  cancel-in-progress: false

jobs:
  select-candidate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.select.outputs.run }}
      sha: ${{ steps.select.outputs.sha }}
      backend: ${{ inputs.backend == 'hosted' && 'hosted' || 'mini' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release-automation.py select-qualification

  qualify:
    needs: [select-candidate]
    if: needs.select-candidate.outputs.run == 'true'
    runs-on: ${{ needs.select-candidate.outputs.backend == 'mini' && fromJSON('["self-hosted", "macOS", "ARM64", "dunecity-builder"]') || fromJSON('["macos-15"]') }}
    timeout-minutes: ${{ needs.select-candidate.outputs.backend == 'mini' && 60 || 120 }}
    outputs:
      admitted: ${{ steps.admission.outputs.admitted }}
    env:
      DUNECITY_RELEASE_BUILD: 'OFF'
      PACKAGE_BUILD: 'false'
      DUNECITY_CANDIDATE_SOURCE: ${{ needs.select-candidate.outputs.sha }}
      TEST_TIER: nightly
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - name: Keep compiler cache outside candidate source
        run: |
          printf 'CCACHE_DIR=%s/dunecity-qualification-ccache\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          if [ "$RUNNER_ENVIRONMENT" = self-hosted ]; then
            echo "QUALIFICATION_VCPKG_CACHE=$HOME/.cache/dunecity-qualification/vcpkg/archives" >> "$GITHUB_ENV"
          else
            echo "QUALIFICATION_VCPKG_CACHE=$HOME/.cache/vcpkg/archives" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.select-candidate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require the declared Mac architecture
        run: test "$(uname -m)" = arm64
      - name: Fingerprint Mac dependencies without the application version
        id: macos-dependencies
        run: echo "key=$(python3 scripts/vcpkg-dependency-key.py)" >> "$GITHUB_OUTPUT"
      - name: Restore compiled Mac objects
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ runner.environment == 'self-hosted' && 'qualification-mini' || 'macos' }}-arm64-deps-v1-${{ steps.macos-dependencies.outputs.key }}
          restore-keys: ${{ runner.environment == 'self-hosted' && 'qualification-mini' || 'macos' }}-arm64
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'vcpkg.json'
      - name: Restore dependency binaries
        uses: actions/cache@v6
        with:
          path: ${{ env.QUALIFICATION_VCPKG_CACHE }}
          key: ${{ runner.environment == 'self-hosted' && 'vcpkg-qualification-mini' || 'vcpkg-macos' }}-arm64-deps-v1-${{ steps.macos-dependencies.outputs.key }}
          restore-keys: ${{ runner.environment == 'self-hosted' && 'vcpkg-qualification-mini' || 'vcpkg-macos' }}-arm64-
      - name: Enable portable dependency cache
        run: |
          mkdir -p "$QUALIFICATION_VCPKG_CACHE"
          echo "VCPKG_BINARY_SOURCES=clear;files,$QUALIFICATION_VCPKG_CACHE,readwrite" >> "$GITHUB_ENV"
      - name: Qualify frozen staging source before production selection
        run: |
          if [ "$RUNNER_ENVIRONMENT" = self-hosted ]; then
            # No --wait: busy resources fall back instead of delaying production.
            agent-workspace run --project dunecity --owner "github:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:qualify" --tests -- \
              dunecity-queue reservation run --cwd "$GITHUB_WORKSPACE" --rev "$DUNECITY_CANDIDATE_SOURCE" \
                --owner "github:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:qualify" --repository "$GITHUB_REPOSITORY" \
                --run-id "$GITHUB_RUN_ID" --lane macos-qualification --purpose verification -- \
                bash "$GITHUB_WORKSPACE/scripts/macos-ci-lane.sh" release-headless-qualification
          else
            bash scripts/macos-ci-lane.sh release-headless-qualification
          fi
      - name: Report whether Mini qualification actually started
        id: admission
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/qualification-admitted-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" ]; then
            echo 'admitted=true' >> "$GITHUB_OUTPUT"
          else
            echo 'admitted=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Freeze successful source/toolchain/test qualification
        run: |
          python3 scripts/release-automation.py record-build --platform macos-arm64-headless-qualification \
            --build-root build --output build/macos-headless-qualification.json
      - uses: actions/upload-artifact@v7
        with:
          name: DuneCity-macOS-headless-qualification-${{ github.run_attempt }}
          path: |
            build/macos-headless-qualification.json
            build/macos-headless-plan.json
            build/macos-headless-results.xml
          if-no-files-found: error
          retention-days: 90
      - name: Preserve qualification diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: DuneCity-macOS-headless-diagnostics-${{ github.run_attempt }}
          path: |
            build/Testing/Temporary/
            build/macos-headless-plan.json
            build/macos-headless-results.xml
          if-no-files-found: warn
          retention-days: 90

  mini-deadline:
    needs: [select-candidate]
    if: needs.select-candidate.outputs.run == 'true' && needs.select-candidate.outputs.backend == 'mini'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Fall back if the Mini runner cannot start within two minutes
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.select-candidate.outputs.sha }}
        run: python3 scripts/qualification-routing.py wait-for-mini

  mini-fallback:
    needs: [select-candidate, qualify]
    if: >-
      always() && !cancelled() && needs.select-candidate.outputs.run == 'true' &&
      needs.select-candidate.outputs.backend == 'mini' && needs.qualify.result == 'failure' &&
      needs.qualify.outputs.admitted != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Use hosted Mac after Mini admission was refused
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.select-candidate.outputs.sha }}
          MINI_ADMITTED: ${{ needs.qualify.outputs.admitted }}
        run: python3 scripts/qualification-routing.py refused-mini
